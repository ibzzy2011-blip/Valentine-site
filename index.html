<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Page</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #fff0f5;
    overflow-x: hidden;
    font-family: 'Arial', sans-serif;
    text-align: center;
  }

  /* Floating hearts */
  .heart {
    position: absolute;
    width: 30px;
    height: 30px;
    background-color: pink;
    transform: rotate(-45deg);
    animation: float 6s infinite;
  }
  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 30px;
    height: 30px;
    background-color: pink;
    border-radius: 50%;
  }
  .heart::before { top: -15px; left: 0; }
  .heart::after { left: 15px; top: 0; }

  @keyframes float {
    0% { transform: translateY(0) rotate(-45deg); opacity: 1; }
    100% { transform: translateY(-1000px) rotate(-45deg); opacity: 0; }
  }

  /* Envelope letters */
  .envelope-container {
    display: flex;
    justify-content: center;
    margin-top: 50px;
    gap: 20px;
  }
  .letter {
    width: 80px;
    height: 100px;
    background: #ffcad4;
    border-radius: 5px;
    position: relative;
    transform: rotateX(90deg);
    transform-origin: top;
    animation: unfold 1s forwards;
    cursor: pointer;
  }
  .letter::before {
    content: "💌";
    font-size: 40px;
    position: absolute;
    top: 20px;
    left: 20px;
  }

  @keyframes unfold {
    to { transform: rotateX(0deg); }
  }

  /* Typing effect */
  .text-container {
    margin-top: 50px;
    font-size: 24px;
    color: #d6336c;
    min-height: 30px;
  }
</style>
</head>
<body>

<div class="envelope-container">
  <div class="letter" onclick="typeText('H')"></div>
  <div class="letter" onclick="typeText('E')"></div>
  <div class="letter" onclick="typeText('A')"></div>
  <div class="letter" onclick="typeText('R')"></div>
  <div class="letter" onclick="typeText('T')"></div>
  <div class="letter" onclick="typeText('S')"></div>
</div>

<div class="text-container" id="typed-text"></div>

<script>
  // Floating hearts generator
  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.animationDuration = 4 + Math.random() * 3 + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }
  setInterval(createHeart, 300);

  // Typing effect
  let fullText = '';
  const typedElement = document.getElementById('typed-text');
  function typeText(letter) {
    fullText += letter;
    let i = 0;
    typedElement.innerHTML = '';
    function typing() {
      if (i < fullText.length) {
        typedElement.innerHTML += fullText[i];
        i++;
        setTimeout(typing, 200);
      }
    }
    typing();
  }
</script>

</body>
</html>
